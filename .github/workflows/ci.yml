name: CI — TypeCheck & Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Quality (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build-only
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-for-ci-build-only
      CRON_SECRET: placeholder-cron-secret-for-ci-only
      CONSULTATIONS_ENABLED: 'false'
      CONSULTATIONS_EMAIL_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-01
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified 2026-10-01
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            database/tests/package-lock.json
      - name: Repository safety and documentation
        run: node scripts/check-repository.cjs
      - name: Install
        run: |
          npm ci
          npm ci --prefix database/tests
      - name: Repository guard tests
        run: npm run test:repo
      - name: Database and API regressions
        run: npm run test:db
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build with placeholders
        run: npm run build

  postgres:
    name: PostgreSQL 17 (Windows, Node 24)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-01
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified 2026-10-01
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            database/tests/package-lock.json
      - name: Install
        run: |
          npm ci
          npm ci --prefix database/tests
      - name: Real PostgreSQL concurrency and restore
        run: node --test database/tests/postgres-concurrency.test.cjs
